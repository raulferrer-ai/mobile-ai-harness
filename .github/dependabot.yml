# Dependency update PRs. The GitHub Actions ecosystem works from day one.
# Uncomment the others after you create the native projects (Dependabot needs a manifest in the directory).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

